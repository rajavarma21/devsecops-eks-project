services:

  redis:
    image: redis:7-alpine
    container_name: devsecops-redis
    restart: unless-stopped

  backend:
    build:
      context: ./application/backend
    image: devsecops-backend:1.0
    container_name: devsecops-backend
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./application/frontend
    image: devsecops-frontend:1.0
    container_name: devsecops-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
